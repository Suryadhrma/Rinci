<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Rinci — demo ekstraksi</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    pre { background: #f4f4f4; padding: 1rem; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
    #status { margin: 0.5rem 0; color: #555; }
    #preview { max-width: 100%; margin-top: 1rem; display: none; }
    nav { margin-bottom: 1.5rem; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav><a href="/index.html">Upload</a> | <a href="/review.html">Review queue</a> | <a href="/dashboard.html">Dashboard eval</a></nav>
  <h1>Rinci — demo ekstraksi</h1>
  <p>Upload struk/nota (JPEG/PNG/WebP), lihat hasil ekstraksi JSON mentah.</p>

  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" />
  <button id="submitBtn">Ekstrak</button>

  <div id="status"></div>
  <img id="preview" alt="preview" />
  <pre id="result"></pre>

  <script>
    const fileInput = document.getElementById('fileInput');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const previewEl = document.getElementById('preview');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      previewEl.src = URL.createObjectURL(file);
      previewEl.style.display = 'block';
    });

    const POLL_INTERVAL_MS = 2000;
    const POLL_TIMEOUT_MS = 120000;

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function pollJob(jobId) {
      const deadline = Date.now() + POLL_TIMEOUT_MS;

      while (Date.now() < deadline) {
        const res = await fetch(`/jobs/${jobId}`);
        if (!res.ok) throw new Error(`Gagal ambil status job (HTTP ${res.status})`);
        const job = await res.json();

        if (job.status === 'COMPLETED' || job.status === 'FAILED') return job;

        statusEl.textContent = `Status: ${job.status}...`;
        await sleep(POLL_INTERVAL_MS);
      }

      throw new Error('Timeout menunggu hasil job.');
    }

    submitBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        statusEl.textContent = 'Pilih file dulu.';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      statusEl.textContent = 'Mengunggah...';
      resultEl.textContent = '';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/extract', { method: 'POST', body: formData });
        const body = await res.json();

        if (!res.ok) {
          statusEl.textContent = `Gagal (HTTP ${res.status})`;
          resultEl.textContent = JSON.stringify(body, null, 2);
          return;
        }

        statusEl.textContent = body.deduped
          ? `File sama pernah diupload (job ${body.jobId}), pakai hasil itu. Menunggu...`
          : `Diterima, job ${body.jobId}. Menunggu...`;
        const job = await pollJob(body.jobId);

        if (job.status === 'COMPLETED') {
          statusEl.textContent = job.needsReview
            ? 'Selesai -- confidence rendah di beberapa field, perlu ditinjau manual.'
            : 'Selesai.';
        } else {
          statusEl.textContent = 'Gagal diproses.';
        }
        resultEl.textContent = JSON.stringify(job, null, 2);
      } catch (err) {
        statusEl.textContent = 'Error.';
        resultEl.textContent = String(err);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
