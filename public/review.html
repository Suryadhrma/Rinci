<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Rinci — review queue</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .toolbar { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem; }
    .toolbar label { display: inline-flex; align-items: center; gap: 0.45rem; cursor: pointer; }
    td.link a { color: var(--color-primary); text-decoration: none; font-weight: 600; }
    td.link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="topnav__brand" href="/index.html">Rinci</a>
    <div class="topnav__links">
      <a href="/index.html">Upload</a>
      <a href="/review.html" class="active">Review queue</a>
      <a href="/dashboard.html">Dashboard eval</a>
    </div>
  </nav>

  <div class="page">
    <h1>Review queue</h1>
    <p class="page-lede">Job yang confidence-nya rendah dan perlu ditinjau manual.</p>

    <div class="toolbar">
      <label><input type="checkbox" id="onlyNeedsReview" checked /> Cuma tampilkan yang perlu direview</label>
    </div>

    <div class="card" style="padding: 0.5rem 1.25rem;">
      <table>
        <thead>
          <tr><th>File</th><th>Status</th><th>Confidence</th><th>Model</th><th>Biaya</th><th>Dibuat</th><th></th></tr>
        </thead>
        <tbody id="jobsBody"></tbody>
      </table>
    </div>
    <p id="emptyMsg" class="empty-state" style="display:none">Tidak ada job.</p>
  </div>

  <script>
    function confidenceClass(score) {
      if (score == null) return '';
      if (score < 0.6) return 'conf-low';
      if (score < 0.85) return 'conf-mid';
      return 'conf-high';
    }

    async function loadJobs() {
      const onlyNeedsReview = document.getElementById('onlyNeedsReview').checked;
      const url = onlyNeedsReview ? '/jobs?needsReview=true&limit=50' : '/jobs?limit=50';
      const res = await fetch(url);
      const jobs = await res.json();

      const tbody = document.getElementById('jobsBody');
      tbody.innerHTML = '';
      document.getElementById('emptyMsg').style.display = jobs.length ? 'none' : 'block';

      for (const job of jobs) {
        const tr = document.createElement('tr');
        const pct = job.confidenceScore != null ? `${(job.confidenceScore * 100).toFixed(0)}%` : '-';
        const cost = job.costUsd != null ? `$${job.costUsd.toFixed(6)}` : '-';
        const status = job.status + (job.reviewed ? ' (sudah direview)' : '');

        tr.innerHTML = `
          <td>${job.filename}</td>
          <td>${status}</td>
          <td class="${confidenceClass(job.confidenceScore)}">${pct}</td>
          <td>${job.modelName ?? '-'}</td>
          <td>${cost}</td>
          <td>${new Date(job.createdAt).toLocaleString('id-ID')}</td>
          <td class="link"><a href="/job.html?id=${job.id}">Buka</a></td>
        `;
        tbody.appendChild(tr);
      }
    }

    document.getElementById('onlyNeedsReview').addEventListener('change', loadJobs);
    loadJobs();
  </script>
</body>
</html>
