<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Rinci — detail job</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .columns { display: flex; gap: 2rem; align-items: flex-start; }
    .col { flex: 1; min-width: 0; }
    .col img { max-width: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
    .meta { color: var(--color-text-muted); font-size: 0.85rem; margin: -0.5rem 0 1.5rem; }
    .legend { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: 1rem; display: flex; gap: 1.25rem; }
    .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.35rem; }
    .dot.conf-high { background: var(--color-success); }
    .dot.conf-mid { background: var(--color-warning); }
    .dot.conf-low { background: var(--color-danger); }
    fieldset { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 1.25rem; padding: 1rem 1.25rem; }
    legend { font-weight: 600; padding: 0 0.4rem; font-size: 0.85rem; }
    table td { padding: 0.35rem 0.4rem; }
    #status { margin-top: 1rem; color: var(--color-text-muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="topnav__brand" href="/index.html">Rinci</a>
    <div class="topnav__links">
      <a href="/index.html">Upload</a>
      <a href="/review.html">Review queue</a>
      <a href="/dashboard.html">Dashboard eval</a>
    </div>
  </nav>

  <div class="page">
    <h1>Detail job</h1>
    <div id="banner"></div>
    <div class="meta" id="meta"></div>

    <div class="columns">
      <div class="col">
        <h3>Dokumen asli</h3>
        <img id="preview" alt="dokumen" />
      </div>
      <div class="col">
        <h3>Hasil ekstraksi</h3>
        <p class="legend">
          <span><span class="dot conf-high"></span>confidence tinggi</span>
          <span><span class="dot conf-mid"></span>sedang</span>
          <span><span class="dot conf-low"></span>rendah -- cek manual</span>
        </p>
        <form id="correctionForm">
          <fieldset>
            <legend>Menu</legend>
            <table>
              <thead><tr><th>Nama</th><th>Jumlah</th><th>Harga</th><th>Harga satuan</th><th></th></tr></thead>
              <tbody id="menuBody"></tbody>
            </table>
            <button type="button" id="addItem">+ Tambah item</button>
          </fieldset>

          <fieldset>
            <legend>Subtotal</legend>
            <table>
              <tbody>
                <tr><th>Subtotal</th><td><input data-group="sub_total" data-field="subtotal_price" /></td></tr>
                <tr><th>Pajak</th><td><input data-group="sub_total" data-field="tax_price" /></td></tr>
                <tr><th>Servis</th><td><input data-group="sub_total" data-field="service_price" /></td></tr>
              </tbody>
            </table>
          </fieldset>

          <fieldset>
            <legend>Total</legend>
            <table>
              <tbody>
                <tr><th>Total</th><td><input data-group="total" data-field="total_price" /></td></tr>
                <tr><th>Bayar tunai</th><td><input data-group="total" data-field="cashprice" /></td></tr>
                <tr><th>Kembalian</th><td><input data-group="total" data-field="changeprice" /></td></tr>
              </tbody>
            </table>
          </fieldset>

          <button type="submit">Simpan koreksi</button>
          <div id="status"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const jobId = new URLSearchParams(location.search).get('id');

    function esc(v) {
      return v == null ? '' : String(v).replace(/"/g, '&quot;');
    }

    function confidenceClass(score) {
      if (score == null) return '';
      if (score < 0.6) return 'conf-low';
      if (score < 0.85) return 'conf-mid';
      return 'conf-high';
    }

    function menuRow(item, index, scores) {
      const tr = document.createElement('tr');
      const fields = ['nm', 'cnt', 'price', 'unitprice'];
      tr.innerHTML = fields
        .map((f) => {
          const cls = confidenceClass(scores?.[`menu[${index}].${f}`]);
          return `<td><input data-menu-field="${f}" class="${cls}" value="${esc(item[f])}" /></td>`;
        })
        .join('') + '<td><button type="button" class="removeItem">Hapus</button></td>';
      return tr;
    }

    function fillGroup(group, data, scores) {
      document.querySelectorAll(`input[data-group="${group}"]`).forEach((input) => {
        const field = input.dataset.field;
        input.value = esc(data?.[field]);
        input.className = confidenceClass(scores?.[`${group}.${field}`]);
      });
    }

    async function load() {
      if (!jobId) {
        document.getElementById('status').textContent = 'Tidak ada job id di URL.';
        return;
      }

      const res = await fetch(`/jobs/${jobId}`);
      if (!res.ok) {
        document.getElementById('status').textContent = `Job tidak ditemukan (HTTP ${res.status})`;
        return;
      }
      const job = await res.json();

      document.getElementById('preview').src = `/jobs/${jobId}/image`;
      document.getElementById('meta').textContent =
        `Status: ${job.status} | Model: ${job.modelName ?? '-'} | ` +
        `Eskalasi: ${job.escalated ? 'ya' : 'tidak'} | Repair prompt: ${job.repaired ? 'ya' : 'tidak'} | ` +
        `Biaya: ${job.usage?.costUsd != null ? '$' + job.usage.costUsd.toFixed(6) : '-'} | ` +
        `Durasi: ${job.usage?.durationMs ?? '-'}ms`;

      const banner = document.getElementById('banner');
      if (job.reviewedAt) {
        banner.innerHTML = `<div class="banner banner--success">Sudah direview pada ${new Date(job.reviewedAt).toLocaleString('id-ID')}.</div>`;
      } else if (job.needsReview) {
        banner.innerHTML = `<div class="banner banner--warning">Confidence rendah -- perlu ditinjau manual sebelum dipakai.</div>`;
      }

      const data = job.correctedResult ?? job.result ?? { menu: [], sub_total: null, total: null };
      const scores = job.confidence?.fieldScores ?? {};

      const menuBody = document.getElementById('menuBody');
      menuBody.innerHTML = '';
      (data.menu ?? []).forEach((item, i) => menuBody.appendChild(menuRow(item, i, scores)));

      fillGroup('sub_total', data.sub_total, scores);
      fillGroup('total', data.total, scores);
    }

    document.getElementById('addItem').addEventListener('click', () => {
      document.getElementById('menuBody').appendChild(menuRow({}, -1, {}));
    });

    document.getElementById('menuBody').addEventListener('click', (e) => {
      if (e.target.classList.contains('removeItem')) {
        e.target.closest('tr').remove();
      }
    });

    function collectGroup(group) {
      const result = {};
      let hasValue = false;
      document.querySelectorAll(`input[data-group="${group}"]`).forEach((input) => {
        const value = input.value.trim();
        result[input.dataset.field] = value === '' ? null : value;
        if (value !== '') hasValue = true;
      });
      return hasValue ? result : null;
    }

    document.getElementById('correctionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusEl = document.getElementById('status');

      const menu = [...document.querySelectorAll('#menuBody tr')].map((tr) => {
        const item = {};
        tr.querySelectorAll('input[data-menu-field]').forEach((input) => {
          const value = input.value.trim();
          item[input.dataset.menuField] = value === '' ? null : value;
        });
        return item;
      });

      const body = { menu, sub_total: collectGroup('sub_total'), total: collectGroup('total') };

      statusEl.textContent = 'Menyimpan...';
      try {
        const res = await fetch(`/jobs/${jobId}/correction`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const responseBody = await res.json();

        if (!res.ok) {
          statusEl.textContent = `Gagal: ${responseBody.message ?? res.status}`;
          return;
        }
        statusEl.textContent = 'Koreksi tersimpan, ditambahkan ke dataset eval.';
        load();
      } catch (err) {
        statusEl.textContent = `Error: ${err}`;
      }
    });

    load();
  </script>
</body>
</html>
