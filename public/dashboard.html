<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Rinci — dashboard eval</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .bar-track { background: var(--color-border); border-radius: 3px; height: 8px; width: 110px; overflow: hidden; display: inline-block; vertical-align: middle; margin-left: 0.5rem; }
    .bar-fill { background: var(--color-success); height: 100%; }
    .run-row { cursor: pointer; transition: background 0.1s ease; }
    .run-row:hover { background: var(--color-surface-muted); }
    .detail { display: none; background: var(--color-surface-muted); }
    .detail.open { display: table-row; }
    .detail > td { padding: 1rem 1.25rem; }
    .field-table { margin: 0; }
    .field-table th, .field-table td { padding: 0.3rem 0.6rem; border: none; font-size: 0.82rem; }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="topnav__brand" href="/index.html">Rinci</a>
    <div class="topnav__links">
      <a href="/index.html">Upload</a>
      <a href="/review.html">Review queue</a>
      <a href="/dashboard.html" class="active">Dashboard eval</a>
    </div>
  </nav>

  <div class="page">
    <h1>Dashboard eval</h1>
    <p class="page-lede">Baca langsung dari <code>eval/runs/*.json</code> — klik satu run buat lihat akurasi per field.</p>

    <div class="card" style="padding: 0.5rem 1.25rem;">
      <table>
        <thead>
          <tr><th>Waktu</th><th>Split</th><th>N</th><th>Model</th><th>Akurasi</th><th>Biaya/dok</th></tr>
        </thead>
        <tbody id="runsBody"></tbody>
      </table>
    </div>
    <p id="emptyMsg" class="empty-state" style="display:none">Belum ada hasil eval. Jalankan <code>npm run eval</code>.</p>
  </div>

  <script>
    function esc(v) {
      return v == null ? '' : String(v);
    }

    function renderFieldTable(fieldAccuracy) {
      if (!fieldAccuracy?.length) return '<p class="empty-state">Tidak ada rincian per field.</p>';
      const rows = fieldAccuracy
        .map((f) => {
          const pct = f.total ? ((f.matched / f.total) * 100).toFixed(1) : '0.0';
          return `<tr><td>${f.field}</td><td>${f.matched}/${f.total}</td><td>${pct}%</td></tr>`;
        })
        .join('');
      return `<table class="field-table"><thead><tr><th>Field</th><th>Match</th><th>%</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    async function loadRuns() {
      const res = await fetch('/eval/runs');
      const runs = await res.json();

      const tbody = document.getElementById('runsBody');
      tbody.innerHTML = '';
      document.getElementById('emptyMsg').style.display = runs.length ? 'none' : 'block';

      // Terbaru dulu.
      runs.sort((a, b) => String(b.timestamp).localeCompare(String(a.timestamp)));

      runs.forEach((run, i) => {
        const modelLabel = run.models ? Object.keys(run.models).join(', ') : run.model ?? '-';
        const avgCost = run.cost?.avgCostUsdPerDoc;
        const costLabel = avgCost != null ? `$${avgCost.toFixed(6)}` : 'n/a (run lama)';
        const pct = run.overall?.pct ?? 0;

        const tr = document.createElement('tr');
        tr.className = 'run-row';
        tr.innerHTML = `
          <td>${new Date(run.timestamp).toLocaleString('id-ID')}</td>
          <td>${esc(run.split)}</td>
          <td>${esc(run.sampleCount)}</td>
          <td>${esc(modelLabel)}</td>
          <td>
            ${pct.toFixed(1)}%
            <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
          </td>
          <td>${costLabel}</td>
        `;

        const detailRow = document.createElement('tr');
        detailRow.className = 'detail';
        const td = document.createElement('td');
        td.colSpan = 6;
        td.innerHTML = renderFieldTable(run.fieldAccuracy);
        detailRow.appendChild(td);

        tr.addEventListener('click', () => detailRow.classList.toggle('open'));

        tbody.appendChild(tr);
        tbody.appendChild(detailRow);
      });
    }

    loadRuns();
  </script>
</body>
</html>
