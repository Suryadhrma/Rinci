name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # `secrets` TIDAK BISA dipakai langsung di job-level `if:` (GitHub
  # Actions nolak seluruh workflow file kalau dicoba -- "Unrecognized
  # named-value: 'secrets'", ditemukan pas semua run CI gagal instan
  # tanpa job sama sekali). Job kecil ini yang cek via step (step BOLEH
  # akses secrets), job `eval` baca hasilnya lewat `needs.*.outputs`.
  check-secret:
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          fi

  eval:
    runs-on: ubuntu-latest
    needs: [build-and-test, check-secret]
    # Fork PR tidak punya akses secrets (GEMINI_API_KEY kosong di sana) --
    # skip daripada gagal merah buat sesuatu yang memang tidak bisa jalan.
    if: needs.check-secret.outputs.has-key == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rinci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rinci
      REDIS_URL: redis://localhost:6379
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
      UPLOAD_DIR: storage/uploads
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Siapkan sampel CORD kecil buat eval CI
        run: python scripts/prepare_dataset.py --split test --n 5
      # n kecil + delay dipertahankan -- eval jalan tiap PR, jangan sampai
      # habiskan kuota harian free tier Gemini yang juga dipakai manual.
      - name: Jalankan eval
        run: npm run eval -- --n 5 --delay-ms 4000
      - name: Upload hasil eval sebagai artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/runs/
